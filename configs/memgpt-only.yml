general:
  concurrent_tools: false
  timeout: 60
  max_retries: 2

memory_tools:
- name: memgpt
  enabled: true
  api_key_env: MEMGPT_API_KEY
  model: gpt-4o-mini
  settings:
    memgpt_config:
      # agent_name auto-generated to prevent context accumulation

benchmarks:
- name: Conversational AI Memory
  enabled: true
  settings: null
- name: Long Context Memory
  enabled: true
  settings: null

metrics:
  latency: true
  success_rate: true
  token_usage: true
  accuracy: true
  memory_quality: true

accuracy:
  providers:
    openai:
      - text-embedding-3-small
    local:
      - all-mpnet-base-v2

output:
  output_file: memgpt_results.json
  verbose: true
