general:
  concurrent: false
  timeout: 30
  max_retries: 1

memory_tools:
- name: memgpt
  enabled: true
  api_key_env: MEMGPT_API_KEY
  model: gpt-4o-mini
  settings:
    memgpt_config:
      # agent_name auto-generated to prevent context accumulation

benchmarks:
- name: Conversational AI Memory
  enabled: true
  settings: null

metrics:
  latency: true
  success_rate: true
  token_usage: true
  accuracy: false
  memory_quality: false

output:
  output_file: memgpt_quick_test.json
  verbose: true
