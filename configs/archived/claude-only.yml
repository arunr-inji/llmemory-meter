general:
  concurrent_tools: false
  timeout: 30
  max_retries: 1

memory_tools:
- name: claude_memory
  enabled: true
  api_key_env: ANTHROPIC_API_KEY
  model: claude-3-5-haiku-20241022
  settings:
    claude_config:
      model: claude-3-5-haiku-20241022
      temperature: 0.2
      max_tokens: 1000

benchmarks:
- name: Conversational AI Memory
  enabled: true
  settings: null

metrics:
  latency: true
  success_rate: true
  token_usage: true
  accuracy: true
  memory_quality: false

accuracy:
  providers:
    openai:
      - text-embedding-3-small
    local:
      - all-mpnet-base-v2

output:
  output_file: claude_results.json
  verbose: true
