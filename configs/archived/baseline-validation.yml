# Baseline Tool Validation Configuration
# Tests mixed store/chat behavior to ensure context continuity
# No API keys required

memory_tools:
- name: baseline
  enabled: true
  api_key_env: null
  model: null
  settings:
    k: 5
- name: full_context
  enabled: true
  api_key_env: null
  model: null
  settings:
    max_messages: null

benchmarks:
- name: Conversational AI Memory
  enabled: true
  workloads:
    - Multi-Session Memory Retention  # Tests mixed store/chat
  settings: null

metrics:
  latency: true
  success_rate: true
  token_usage: true
  accuracy: true
  memory_quality: false

accuracy:
  providers:
    local:
      - all-mpnet-base-v2

output:
  save_results: true
  output_file: baseline_validation_results.json
  print_summary: true
  detailed_logs: true

general:
  timeout: 60
  max_retries: 2
  concurrent_tools: false
  debug: true
