general:
  concurrent_tools: false
  timeout: 30
  max_retries: 1

memory_tools:
- name: zep
  enabled: true
  api_key_env: ZEP_API_KEY
  model: null
  settings:
    api_url: https://api.getzep.com

benchmarks:
- name: Conversational AI Memory
  enabled: true
  settings: null

metrics:
  latency: true
  success_rate: true
  token_usage: true
  accuracy: true
  memory_quality: false

accuracy:
  providers:
    openai:
      - text-embedding-3-small
    local:
      - all-mpnet-base-v2

output:
  output_file: zep_results.json
  verbose: true
