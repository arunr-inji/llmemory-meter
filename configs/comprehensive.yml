# Comprehensive Configuration - All Memory Tools & Benchmarks
# Perfect for tech journal articles and in-depth comparisons
# Requires: MEM0_API_KEY, OPENAI_API_KEY, ANTHROPIC_API_KEY
# Optional: MemGPT, Zep, Claude Memory

memory_tools:
- name: mem0
  enabled: true
  api_key_env: MEM0_API_KEY
  model: gpt-4o-mini
  settings:
    user_id: benchmark_user
    llm_provider: openai
    llm_api_key_env: OPENAI_API_KEY
    llm_config:
      model: gpt-4o-mini
      temperature: 0.2
      max_tokens: 1500
    vector_store:
      provider: qdrant
      host: localhost
      port: 6333
      collection_name: llmemory_benchmarks
- name: openai_memory
  enabled: true
  api_key_env: OPENAI_API_KEY
  model: gpt-4o-mini
  settings:
    temperature: 0.3
    max_tokens: 300
- name: memgpt
  enabled: true
  api_key_env: MEMGPT_API_KEY
  model: gpt-4o-mini
  settings:
    user_id: benchmark_user
    memgpt_config:
      agent_name: benchmark_agent_comprehensive
- name: claude_memory
  enabled: true
  api_key_env: ANTHROPIC_API_KEY
  model: claude-3-haiku-20240307
  settings:
    user_id: benchmark_user
    claude_config:
      model: claude-3-haiku-20240307
      temperature: 0.2
      max_tokens: 1000
- name: zep
  enabled: true
  api_key_env: ZEP_API_KEY
  model: gpt-4o-mini
  settings: {}

benchmarks:
- name: Conversational AI Memory
  enabled: true
  settings: null
- name: Long Context Memory
  enabled: true
  settings: null
- name: Persona Consistency
  enabled: true
  settings: null
- name: Technical Performance
  enabled: true
  settings: null
- name: Memory Stress Testing
  enabled: true
  settings: null
- name: Domain-Specific Applications
  enabled: true
  settings: null

metrics:
  latency: true
  success_rate: true
  token_usage: true
  accuracy: true
  memory_quality: true

output:
  save_results: true
  output_file: comprehensive_results.json
  print_summary: true
  detailed_logs: true

general:
  timeout: 120  # Longer timeout for comprehensive tests
  max_retries: 3
  concurrent_tools: false  # Sequential for stability
  debug: false
