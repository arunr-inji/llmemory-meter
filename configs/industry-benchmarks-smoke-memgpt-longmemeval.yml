general:
  concurrent_tools: false
  timeout: 60
  max_retries: 1
  store_retrieve_only: true
  step_timeout_seconds: 90
  step_heartbeat_seconds: 10

memory_tools:
- name: mem0
  enabled: false
  api_key_env: MEM0_API_KEY
  model: gpt-4o-mini
  settings:
    llm_provider: openai
    llm_api_key_env: OPENAI_API_KEY
    llm_config:
      model: gpt-4o-mini
      temperature: 0.2
      max_tokens: 1500
    vector_store:
      provider: qdrant
      host: localhost
      port: 6333
      collection_name: llmemory_benchmarks
- name: zep
  enabled: false
  api_key_env: ZEP_API_KEY
  model: null
  settings:
    api_url: https://api.getzep.com
- name: memgpt_memory_blocks
  enabled: true
  api_key_env: MEMGPT_API_KEY
  model: gpt-4o-mini
  settings:
    memory_mode: default
    memgpt_config:
      # agent_name auto-generated to prevent context accumulation

benchmarks:
- name: LongMemEval
  enabled: true
  settings:
    subset: "S"
    limit: 1
- name: MemBench
  enabled: false
  settings:
    categories: null
    limit: 1

metrics:
  latency: true
  success_rate: true
  token_usage: true
  accuracy: false
  memory_quality: false
  cost_analysis: true

output:
  save_results: true
  output_file: results/validation_runs/smoke_memgpt_longmemeval_results.json
  print_summary: true
  detailed_logs: false
