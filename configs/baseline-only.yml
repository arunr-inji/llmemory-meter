# Baseline-Only Configuration
# Quick smoke test for baseline tool only
# No API keys required

memory_tools:
- name: baseline
  enabled: true
  api_key_env: null
  model: null
  settings:
    k: 5

benchmarks:
- name: Conversational AI Memory
  enabled: true
  settings: null

metrics:
  latency: true
  success_rate: true
  token_usage: true
  accuracy: false
  memory_quality: false

output:
  save_results: true
  output_file: baseline_results.json
  print_summary: true
  detailed_logs: true

general:
  timeout: 60
  max_retries: 2
  concurrent_tools: false
  debug: false
