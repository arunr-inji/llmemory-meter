general:
  concurrent: false
  timeout: 30
  max_retries: 1

memory_tools:
- name: openai_memory
  enabled: true
  api_key_env: OPENAI_API_KEY
  model: gpt-4o-mini
  settings:
    temperature: 0.3
    max_tokens: 300

benchmarks:
- name: Conversational AI Memory
  enabled: true
  settings: null

metrics:
  latency: true
  success_rate: true
  token_usage: true
  accuracy: true
  memory_quality: false
  cost_analysis: true

accuracy:
  providers: [openai, local]
  openai:
    model: text-embedding-3-small
  local:
    model: all-mpnet-base-v2

output:
  output_file: openai_results.json
  verbose: true
