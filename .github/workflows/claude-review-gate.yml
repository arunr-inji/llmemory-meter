name: Claude Review Gate

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review]

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Enforce Claude review label
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const action = context.payload.action;
            let labels = (pr.labels || []).map((l) => l.name);
            const requiredLabel = "claude-reviewed";

            if (action === "synchronize" && labels.includes(requiredLabel)) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                name: requiredLabel,
              });
              labels = labels.filter((name) => name !== requiredLabel);
              core.notice("Removed claude-reviewed label due to new commits. Re-run @claude review.");
            }

            if (!labels.includes(requiredLabel)) {
              core.setFailed(
                "Missing required claude-reviewed label. Trigger @claude review and wait for Claude Code workflow success."
              );
              return;
            }

            core.info("Claude review gate passed.");
